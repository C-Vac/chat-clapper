<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="theme-color" content="#000000" />
  <title>Chat Clapper 3000</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/react-highlight@0.12.0/node_modules/highlight.js/styles/github.min.css" />
  <style>
    /* Optional: Add a custom scrollbar style for better aesthetics if desired */
    /* For Webkit browsers */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #c7c7c7;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a3a3a3;
    }

    /* For Firefox */
    /* Firefox scrollbar styling is more limited, this provides basic width/color */
    * {
      scrollbar-width: thin;
      scrollbar-color: #c7c7c7 #f1f1f1;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
