<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Site 2</title>
     <!-- Identical CSS -->
    <style>
        body { font-family: sans-serif; }
        #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 5px; padding: 3px; border-bottom: 1px dotted #eee; }
        .message .author { font-weight: bold; color: green; } /* Different color */
        .message .content { margin-left: 5px; }
        /* Style applied by userscript */
        .clapped-message { opacity: 0.5; font-style: italic; }
    </style>
</head>
<body>
    <h1>Chat Site 2</h1>
    <div id="chat-box">
        <!-- Messages will be added dynamically -->
    </div>
    <button id="add-msg-btn">Add Test Message</button>
    <!-- Identical JS -->
    <script>
        const chatBox = document.getElementById('chat-box');
        let messageCounter = 0;
        function addChatMessage(author, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.id = `msg-${messageCounter++}`;
            const authorSpan = document.createElement('span');
            authorSpan.classList.add('author');
            authorSpan.textContent = `${author}:`;
            const contentSpan = document.createElement('span');
            contentSpan.classList.add('content');
            contentSpan.textContent = text;
            msgDiv.appendChild(authorSpan);
            msgDiv.appendChild(contentSpan);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            console.log(`[Fixture] Added message: ${author} - ${text}`);
        }
         window.addChatMessage = addChatMessage;
        document.getElementById('add-msg-btn')?.addEventListener('click', () => {
            const users = ['Frank', 'Grace', 'Heidi_Target', 'Ivan'];
            const messages = ['Another site!', 'Testing again.', 'This one too!', 'Clap me maybe?'];
            addChatMessage(
                users[Math.floor(Math.random() * users.length)],
                messages[Math.floor(Math.random() * messages.length)]
            );
        });
        console.log("[Fixture] Chat page 2 script loaded.");
    </script>
</body>
</html>
